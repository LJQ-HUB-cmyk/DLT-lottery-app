name: Auto Crawl Lottery Results

on:
  schedule:
    # 开奖后5分钟开始，每隔5分钟尝试一次，最多3次
    # 大乐透开奖时间：21:30
    # 第一次尝试：21:35
    - cron: '35 13 * * 1,3,6'  # UTC 13:35 = 北京时间 21:35
    # 第二次尝试：21:40
    - cron: '40 13 * * 1,3,6'  # UTC 13:40 = 北京时间 21:40
    # 第三次尝试：21:45
    - cron: '45 13 * * 1,3,6'  # UTC 13:45 = 北京时间 21:45
  
  # 允许手动触发
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式（不提交更改）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  crawl-lottery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 lxml
    
    - name: Run lottery crawler
      id: crawl
      env:
        MAX_RETRIES: '1'  # 每次工作流只尝试1次，由cron控制重试
        RETRY_INTERVAL: '5'
      run: |
        cd scripts
        python crawl_smart.py
        
    - name: Check for changes
      id: git-check
      run: |
        git diff --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT
        
    - name: Commit and push if changed
      if: steps.git-check.outputs.has_changes == 'true' && github.event.inputs.test_mode != 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add lottery-app/src/data/lottery-history.txt
        git commit -m "🤖 Auto: Update lottery results $(date +'%Y-%m-%d %H:%M')"
        git push
        
    - name: Summary
      if: always()
      run: |
        if [ "${{ steps.git-check.outputs.has_changes }}" == "true" ]; then
          echo "✅ New lottery data found and committed"
        else
          echo "ℹ️ No new lottery data or test mode"
        fi
