name: Auto Fetch Lottery Data

on:
  schedule:
    # 每周一、三、六晚上 23:00 (UTC+8) 运行，大乐透开奖时间
    - cron: '0 15 * * 1,3,6'  # UTC 时间 15:00 = 北京时间 23:00
  workflow_dispatch:  # 支持手动触发

jobs:
  fetch-lottery-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Fetch lottery data
        run: node lottery-app/scripts/fetch-lottery-data.js
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "has_changes=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lottery-app/src/data/lottery-history.txt
          git commit -m "auto: 更新大乐透开奖数据" || echo "No changes to commit"
          git push
