name: Auto Crawl Multi-Lottery Data

on:
  schedule:
    # 大乐透: 每周一、三、六 21:35 (UTC 13:35)
    - cron: '35 13 * * 1,3,6'
    # 双色球: 每周二、五、日 21:35 (UTC 13:35)
    - cron: '35 13 * * 2,5,0'
  
  workflow_dispatch:
    inputs:
      lottery_type:
        description: 'Lottery type to crawl'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - dlt
          - ssq
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: false
        type: boolean

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      
      - name: Determine lottery type
        id: determine
        run: |
          # 从日期判断应该爬取哪个彩种
          WEEKDAY=$(date +%w)
          if [[ "${{ github.event.inputs.lottery_type }}" != "" ]]; then
            LOTTERY_TYPE="${{ github.event.inputs.lottery_type }}"
          elif [[ $WEEKDAY == "1" ]] || [[ $WEEKDAY == "3" ]] || [[ $WEEKDAY == "6" ]]; then
            LOTTERY_TYPE="dlt"
          elif [[ $WEEKDAY == "2" ]] || [[ $WEEKDAY == "5" ]] || [[ $WEEKDAY == "0" ]]; then
            LOTTERY_TYPE="ssq"
          else
            LOTTERY_TYPE="all"
          fi
          echo "lottery_type=$LOTTERY_TYPE" >> $GITHUB_OUTPUT
      
      - name: Run crawlers
        run: |
          python scripts/crawl_universal.py --type ${{ steps.determine.outputs.lottery_type }}
      
      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push (if not dry run)
        if: steps.check.outputs.has_changes == 'true' && github.event.inputs.dry_run == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "feat: 自动更新彩票数据 - ${{ steps.determine.outputs.lottery_type }} @ $(date +'%Y-%m-%d %H:%M:%S')"
          git push
      
      - name: Summary (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 干运行模式 - 以下文件会被修改:"
          git status --porcelain
      
      - name: Data sources status
        run: |
          python -c "from scripts.data_source_manager import DataSourceManager; print(DataSourceManager().get_status_report())"
